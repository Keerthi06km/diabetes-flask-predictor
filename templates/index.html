<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diabetes Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Diabetes Prediction</h1>

        <p class="subtitle">
            Enter the patient details below
        </p>

        <form method="POST">

            <label>Pregnancies</label>
            <input type="number"
                   name="pregnancies"
                   step="any"
                   required>

            <label>Glucose</label>
            <input type="number"
                   name="glucose"
                   step="any"
                   required>

            <label>Blood Pressure</label>
            <input type="number"
                   name="blood_pressure"
                   step="any"
                   required>

            <label>Skin Thickness</label>
            <input type="number"
                   name="skin_thickness"
                   step="any"
                   required>

            <label>Insulin</label>
            <input type="number"
                   name="insulin"
                   step="any"
                   required>

            <label>BMI</label>
            <input type="number"
                   name="bmi"
                   step="any"
                   required>

            <label>Diabetes Pedigree Function</label>
            <input type="number"
                   name="diabetes_pedigree"
                   step="any"
                   required>

            <label>Age</label>
            <input type="number"
                   name="age"
                   step="any"
                   required>

            <button type="submit">
                Predict
            </button>

        </form>

        {% if prediction %}

        <div class="result">
            <h2>Prediction Result</h2>
            <p>{{ prediction }}</p>
        </div>

        {% endif %}

    </div>

</body>

</html>
